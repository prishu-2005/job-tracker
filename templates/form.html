{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card shadow-sm">
            <div class="card-body">
                <h3 class="mb-3">{{ "Edit" if application else "Add" }} application</h3>
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Company</label>
                        <input type="text" name="company" class="form-control" required
                               value="{{ application['company'] if application else '' }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Role</label>
                        <input type="text" name="role" class="form-control" required
                               value="{{ application['role'] if application else '' }}">
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Status</label>
                            <select name="status" class="form-select">
                                {% for s in statuses %}
                                    <option value="{{ s }}"
                                        {% if application and application['status'] == s %}selected{% endif %}>
                                        {{ s }}
                                    </option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Date applied</label>
                            <input type="date" name="applied_date" class="form-control"
                                   value="{{ application['applied_date'] if application and application['applied_date'] else '' }}">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Notes</label>
                        <textarea name="notes" rows="3" class="form-control">{{ application['notes'] if application and application['notes'] else '' }}</textarea>
                    </div>
                    <button class="btn btn-primary">Save</button>
                    <a href="{{ url_for('home') }}" class="btn btn-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
